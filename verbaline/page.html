.tlln.chat{opacity:.72;background:#14171e}.tlln.gone{opacity:.55}.tlln.now{outline:2px solid var(--acc);background:#18222e}.tlrow.hl .tlln,.tlrow.hl .tlev{background:#1f3326;transition:background 1.5s}

.ek.failed{color:var(--bad);background:#3a1d1d}.ek.kill{color:#ff9e6b;background:#33241a}.ek.loss{color:#fff;background:#8a2a2a}.ek.hurry{color:#9fb4ff;background:#1c2338}.ek.end{color:var(--fg);background:#2a2f3c}

</style></head><body>
<header><b>Verbaline For Games</b>
<span class="tabs"><button id="tLines" onclick="setTab('lines')">Lines</button> <button id="tCast" onclick="setTab('cast')">Cast</button> <button id="tTime" onclick="setTab('timeline')" title="When each line of a group plays, and what is happening around it (projects with a timeline hook)">Timeline</button></span>
<span id="lf"><select id="voice"><option value="">all voices</option></select>
<select id="group"><option value="">all groups</option></select>
<select id="show"><option value="todo">needs a pick</option><option value="all">everything</option><option value="picked">picked</option><option value="regen">flagged for new takes</option><option value="tweak">has prompts</option><option value="pending">words not in game yet</option><option value="old">has old-word takes</option><option value="drift" title="Picked takes cloned from a reference since replaced, or whose voice match to their reference is under 50">picks in an older voice</option></select>
<input id="q" placeholder="search text" size="14">
<select id="mic" title="The microphone ● Record uses"><option value="">default mic</option></select></span>
<span id="tf" hidden></span><span class="count" id="count"></span><span id="bulk"></span><span id="game"></span></header>
<div id="clr"></div><main id="lines"></main><main id="cast" hidden></main><main id="timeline" hidden></main>
<aside id="jobs"><div id="jrail" onclick="setJobs(1)" title="Show the jobs and their output"></div><div class="jgrip" onmousedown="gripJobs(event)" title="Drag to make the sidebar wider or narrower"></div>
<div class="jpane"><div class="jtop"><span id="jdot"></span><b>Jobs</b><span id="jsum" class="src"></span><span style="flex:1"></span>
<button id="jclear" onclick="clearJobs()" title="Forget finished jobs and their output, once you're done with a wave of work (the running job and the queue stay)">Clear history</button>
<button onclick="setJobs(0)" title="Hide the sidebar (its rail shows when jobs run)">»</button></div>
<div id="jlist"></div><div class="jouth">Output</div><pre id="jlog"></pre></div></aside>
<datalist id="xaiv"></datalist>
<script>
let S=[],C=null,J={},tab='lines',sel=0,editing=null,lastDone=null,CV=null,GEN={};const opened=new Set();   // CV: the cast member the Cast tab shows
const $=id=>document.getElementById(id);
// The emotions in one order everywhere (the palette, the presets, the pickers, the line's menu): everyday, heat, hurt
// and hush. Any emotion the server adds and this list lacks goes at the end.
const ORDER=['neutral','calm','warm','playful','urgent','shouting','angry','vengeful','whisper','sad','crying','stunned'];
const EMO=()=>[...ORDER.filter(e=>C.emotions.includes(e)),...C.emotions.filter(e=>!ORDER.includes(e))];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>x==null?'–':Math.round(x*100);
try{tab=localStorage.getItem('vs_tab')||'lines'}catch(e){}
async function api(u,b){const r=await fetch(u,b===undefined?{}:{method:'POST',body:JSON.stringify(b)});const j=await r.json();if(!r.ok||j.error){flash(j.error||'failed');throw new Error(j.error)}return j}
function flash(msg){let e=$('toast');if(e){e.style.background='#3a1d1d';e.style.borderColor='var(--bad)'}if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#3a1d1d;border:1px solid var(--bad);color:#fff;padding:8px 14px;border-radius:8px;z-index:9';document.body.appendChild(e)}
 e.textContent=msg;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,6000)}
async function loadAll(){[S,C]=await Promise.all([api('/api/state'),api('/api/cast')]);fill();draw()}
function fill(){const vs=C.voices.map(v=>v.id),gt={};(C.groups||[]).forEach(g=>gt[g.id]=g.title);const ms=[...new Set(S.map(l=>l.group))];
 const keep=(id,opts,first)=>{const s=$(id),v=s.value;s.innerHTML=`<option value="">${first}</option>`+opts.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');s.value=v};
 keep('voice',vs.map(v=>[v,v]),'all voices');keep('group',ms.map(m=>[m,gt[m]||m||'(no group)']),'all groups');$('group').style.display=ms.length>1?'':'none';
 $('xaiv').innerHTML=C.xai_voices.map(v=>`<option value="${v}">`).join('')}
function setTab(t){tab=t;try{localStorage.setItem('vs_tab',t)}catch(e){}try{history.replaceState(null,'',t=='cast'&&CV?'#cast/'+CV:t=='timeline'&&TL.g?'#timeline/'+encodeURIComponent(TL.g):'#'+t)}catch(e){}draw();if(t=='timeline')loadTimeline()}
function draw(){
 // Keep the field being typed in (and its unsaved text) across redraws.
 const a=document.activeElement,free=a&&['INPUT','TEXTAREA'].includes(a.tagName)&&!a.closest('[data-card]')&&(a.id||a.dataset.pron!==undefined)?{id:a.id,pron:a.dataset.pron,v:a.value,s:a.selectionStart,e:a.selectionEnd}:null,keepF=a&&(a.dataset.f||a.dataset.pf||['tw','wd','lf','cfs','cft','pe'].includes(a.id))?{card:a.closest('[data-card]')?.dataset.card,f:a.dataset.f||a.dataset.pf||a.id,v:a.value,s:a.selectionStart,e:a.selectionEnd}:null;
 $('tLines').classList.toggle('on',tab=='lines');$('tCast').classList.toggle('on',tab=='cast');$('tTime').classList.toggle('on',tab=='timeline');$('lf').hidden=tab!='lines';$('tf').hidden=tab!='timeline';
 $('lines').hidden=tab!='lines';$('cast').hidden=tab!='cast';$('timeline').hidden=tab!='timeline';
 if(tab=='lines')drawLines();else if(tab=='cast'){drawCast();$('bulk').innerHTML=''}else{drawTimeline();$('bulk').innerHTML=''}drawClear();
 if(keepF){const card=document.querySelector(`[data-card="${CSS.escape(keepF.card||'')}"]`);const el=card&&(['tw','wd','lf','cfs','cft','pe'].includes(keepF.f)?card.querySelector('#'+keepF.f):card.querySelector(`[data-f="${keepF.f}"],[data-pf="${keepF.f}"]`));
  if(el){el.value=keepF.v;el.focus();try{el.setSelectionRange(keepF.s,keepF.e)}catch(e){}}}
 if(free){const el=free.id?$(free.id):document.querySelector(`[data-pron="${CSS.escape(free.pron)}"]`);if(el){el.value=free.v;el.focus();try{el.setSelectionRange(free.s,free.e)}catch(e){}}}
 paint()}

// ------------------------------------------------------------------ Lines
function shown(){const v=$('voice').value,m=$('group').value,s=$('show').value,q=$('q').value.toLowerCase();
 return S.filter(l=>(!v||l.voice==v)&&(!m||String(l.group)==m)&&(!q||l.text.toLowerCase().includes(q)||l.note.toLowerCase().includes(q))&&
  (s=='all'||(s=='todo'&&!l.pick)||(s=='picked'&&l.pick)||(s=='regen'&&l.regen)||(s=='tweak'&&l.tweaks)||(s=='pending'&&l.pending)||(s=='old'&&l.takes.some(t=>t.old))||(s=='drift'&&drift(l))))}
// A pick whose voice no longer matches its reference (a voice's references were replaced after picks were cloned from
// them): offered to ⇄ Mirror into today's voice.
function drift(l){const t=l.pick&&l.takes.find(x=>x.path==l.pick);return t&&(l.pick_older||t.voice!=null&&t.voice<.5)&&!(t.source||'').startsWith('you')?t:null}
// A take's checks, not a ranking: of 113 lines a director picked, the top score was the pick 12% of the time, below
// a random pick's 18%, and the top scores were too dry. The scorer catches defects: words wrong or stray words at the
// ends, a voice that drifted, rough (warbly) audio. Your own recordings are conversions by nature: no voice or audio flags.
function checks(t){if(t.total==null)return[];const you=(t.source||'').startsWith('you');
 return [...(t.total===0?['words']:[]),...(t.edges?['ends']:[]),...(!you&&t.voice!=null&&t.voice<.5?['voice?']:[]),...(!you&&t.quality!=null&&t.quality<.7?['rough']:[])]}
function checksTip(t,l){if(t.total==null)return 'Not scored yet';const f=checks(t);
 const why={words:'the words are too far from the script',ends:'extra or wrong words at the start or end',
  'voice?':`it drifts from ${l.voice}'s ${t.ref||''} reference`,rough:'rough audio, likely warble (a conversion: ✦ Restyle reads them cleanly now)'};
 return `Checks, not a ranking: words ${pct(t.wer==null?null:1-t.wer)} · voice match ${pct(t.voice)} · audio ${pct(t.quality)}.${f.length?' '+f.map(x=>x+': '+why[x]).join('; ')+'.':' Nothing wrong found.'} They can't hear acting, so the newest takes come first.`}
const engLabel=id=>{const e=C.engines.find(x=>x.id==id);return e?e.label+(e.cloud?' · cloud':' · local'):id};
function drawLines(){drawGame();drawBulk();const L=shown();$('count').textContent=L.length+' lines · '+S.filter(l=>l.pick).length+'/'+S.length+' picked';
 $('lines').innerHTML=L.map((l,i)=>{const top=l.takes.slice(0,3),rest=l.takes.slice(3);
  const ed=(mode,t)=>editing&&editing.mode==mode&&editing.key==l.key&&editing.path==t.path;
  const vr=(C.voices.find(x=>x.id==l.voice)||{refs:[]}).refs.map(r=>r.emotion);
  const row=(t,n)=>{const picked=l.pick==t.path,off=(t.wer!=null&&t.wer>0||t.edges)&&!t.old,f=checks(t),cls=t.total==null?'':t.total==0?'bad':f.length?'warn':'good';
   return `<div class="tk ${picked?'on':''}">${play(t.path)}<span class="tnum">${n}</span>
    <span class="tsrc"><span class="tnm">${esc(t.name.replace(/\.wav$/,''))}</span> · ${esc(t.source)}${t.ref&&!t.how?` · <span title="Cloned from ${esc(l.voice)}'s ${t.ref} reference">${esc(t.ref)} ref</span>`:''}</span>
    ${t.old?`<span class="old" title="Made from: “${esc(t.old)}”">old words</span>`:''}
    <span class="heardc">${off&&t.heard?`<span title="What Whisper heard (the script says: “${esc(l.text)}”)">heard “${esc(t.heard)}”</span>`:''}</span>
    <span class="score ${cls}" title="${checksTip(t,l)}">${t.total==null?'–':f.length?f.join(' · '):'✓'}</span>
    <button class="pk ${picked?'p':''}" onclick="pick('${l.key}','${picked?'':t.path}')" title="${picked?'Click to clear the pick':'The take that ships'}">${picked?'✓ Picked':'Pick'}</button>
    <button class="mini more ${ACT&&ACT.path==t.path||editing&&editing.path==t.path?'t':''}" title="More for this take: prompt, ✦ restyle, ⇄ mirror, make it a reference" onclick="takeActs('${l.key}','${t.path}')">⋯</button></div>
    ${ACT&&ACT.key==l.key&&ACT.path==t.path&&!(editing&&editing.path==t.path)?`<div class="acts"><span class="src">take ${n} · ${esc(t.name.replace(/\.wav$/,''))}:</span>
      <button onclick="edit('tweak','${l.key}','${t.path}')" title="What to change in the next takes, starting from this one">✎ Prompt</button>
      <button onclick="lineForm('restyle','${l.key}','${t.path}')" title="The same voice in a new delivery: this take read again (shouting, whispering, crying, vengeful…), as new takes">✦ Restyle</button>
      <button onclick="lineForm('mirror','${l.key}','${t.path}')" title="The same delivery in another voice: this take's timing and intonation re-voiced into a reference or candidate, as new takes">⇄ Mirror</button>
      <button onclick="lineForm('beat','${l.key}','${t.path}')" title="This take with a pause put in, after each sentence or after a word you choose, as a new take">⏸ Add a beat</button>
      ${t.how&&t.how.kind=='parts'&&l.parts.length?`<button onclick="mixFrom('${l.key}','${t.path}')" title="Choose this take's try of every part in the parts panel above: then swap just the part you want and Join">✂ Use its parts</button>`:''}
      <button onclick="edit('ref','${l.key}','${t.path}')" title="Make this take a character's reference clip">★ Make a reference</button>
      <button class="x" onclick="ACT=null;draw()" title="Close">✕</button></div>`:''}
    ${ed('tweak',t)?`<div class="ed2"><textarea id="tw" placeholder="Keep this read, but… (e.g. faster; more fear on 'Nobody'; drop the pause after 'gone')">${esc(t.tweak)}</textarea>
      <button class="t" onclick="saveTweak('${l.key}','${t.path}')">save</button><button onclick="editing=null;draw()">cancel</button>${t.tweak?`<button onclick="tweak('${l.key}','${t.path}','')">delete</button>`:''}</div>`
     :ed('ref',t)?refEditHtml(l,t)
     :ed('restyle',t)||ed('mirror',t)||ed('beat',t)?lineFormHtml(l,t)
     :(t.tweak?`<div class="tw2">✎ ${esc(t.tweak)}</div>`:'')}${t.how&&!ed('restyle',t)&&!ed('mirror',t)&&!ed('beat',t)?`<div class="tw2 how">${howLabel(t.how)}</div>`:''}`};
  const vopts=C.voices.map(v=>`<option value="${v.id}" ${v.id==l.voice?'selected':''}>${v.id}${v.id==l.voice_default?' (speaker\'s)':''}</option>`).join('');
  const eopts=EMO().map(e=>`<option ${e==l.emotion?'selected':''}>${e}</option>`).join('');
  const auto=l.ref_auto||l.emotion;
  const engSel=`<select class="es" data-f="engine" title="Which engine makes this line's takes (saved with the line; the voice's own is set on the Cast tab)" onchange="engPick(this)"><option value="" data-cloud="${(C.engines.find(e=>e.id==l.voice_engine)||{}).cloud?1:0}">${esc(engLabel(l.voice_engine))} (voice's)</option>${C.engines.filter(e=>e.id!=l.voice_engine).map(e=>`<option value="${e.id}" data-cloud="${e.cloud?1:0}" ${e.id==l.engine_line?'selected':''}>${esc(e.label)}${e.cloud?' · cloud, paid':' · local'}</option>`).join('')}</select>`;
  const G=GEN[l.key]||{};
  const refSel=vr.length?`<select class="rs" onchange="(GEN['${l.key}']=GEN['${l.key}']||{}).ref=this.value" title="Which of ${esc(l.voice)}'s reference clips to clone (local engines). Auto: the line's emotion if there's one, else neutral, calm or its nearest kin."><option value="">reference: auto (${auto})</option>${EMO().filter(e=>vr.includes(e)).map(e=>`<option value="${e}" ${G.ref==e?'selected':''}>reference: ${e}</option>`).join('')}</select>`:'';
  return `<div class="card ${i==sel?'sel':''}" id="L${i}" data-card="${l.key}" onclick="sel=${i};mark()">

   <span class="ids">${l.ids.join(', ')}</span>${l.kind?`<span class="pill" title="The project's kind of line">${esc(l.kind)}</span>`:''}${tlGroups().some(g=>String(g.id)==String(l.group))?`<a class="lnk" href="#timeline/${encodeURIComponent(l.group)}/${esc(l.key)}" onclick="event.stopPropagation()" title="When it plays in ${esc(groupTitle(l.group))}, and what is happening around it (the Timeline tab)">⏱ when it plays</a>`:''}${l.pick?'<span class="picked">✓ picked</span>':''}${l.tweaks?`<span class="badge">✎ ${l.tweaks} prompt${l.tweaks>1?'s':''}</span>`:''}${l.regen?'<span class="badge" style="color:var(--warn)">flagged for new takes</span>':''}<span class="saved"></span></div>

// ✂ Parts: one cue directed tone by tone inside itself. The markup ([urgent]…[/][sad]…[/], [pause 0.8]) is saved with the line
// (directions.toml parts); each part is made on its own, cloning the voice's reference for its tone, and the parts are
// joined into whole takes (lineparts.py). Each part keeps its tries: ▶ hears one alone, "use" chooses the one a join
// takes, ↻ makes more of just that part (each joined with the others' choices, so it's heard in place).
const TONEC={neutral:'#a9b1c4',calm:'#4fd1c5',warm:'#ffb454',playful:'#f2e35c',urgent:'#ff9e6b',shouting:'#ff6b6b',angry:'#ff4f6d',vengeful:'#c79bff',whisper:'#9fb4ff',sad:'#5cc8ff',crying:'#7fa8ff',stunned:'#ff8fc7'};
let PE=null;const PX=new Set();          // PE: the parts being written; PX: parts showing all their tries
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const wordsOf=x=>String(x||'').toLowerCase().replace(/<[^<>]*>/g,'').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
function partsParse(m,emo){const A=(C.tones||{}).aliases||{},E=C.emotions,out=[];let cur=emo,tag=null,buf='',pos=0;
 const tone=w=>{w=w.trim().toLowerCase();return E.includes(w)?w:A[w]||null};
 const close=g=>{const t=buf.replace(/\s+/g,' ').trim();buf='';if(/[A-Za-z0-9]/.test(t.replace(/<[^<>]*>/g,'')))out.push({tone:cur,tag,text:t,gap:C.tones.gap});if(g!=null&&out.length)out[out.length-1].gap=g};
 const re=/\[([^\[\]]*)\]/g;let x;
 while((x=re.exec(m))){buf+=m.slice(pos,x.index);pos=re.lastIndex;const inner=x[1].trim();
  if(inner=='/'){close();cur=emo;tag=null;continue}
  const p=inner.match(/^(pause|beat)(?:\s+(\d+(?:\.\d+)?)\s*s?)?$/i);if(p){close(p[2]?+p[2]:C.tones.pause);continue}
  const t=tone(inner);if(!t)return{parts:out,err:`“[${inner}]” isn't a tone: ${EMO().join(', ')}, or [pause 0.8]`};close();cur=t;tag=inner}
 buf+=m.slice(pos);close();if(out.length)out[out.length-1].gap=0;return{parts:out,err:out.length?'':'no words yet'}}

  stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:mic?{exact:mic}:undefined,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ctx=new AudioContext();await ctx.audioWorklet.addModule(CAP);if(ctx.state!='running')await ctx.resume();

  const R=REC={key,stream,ctx,sr:ctx.sampleRate,chunks:[],len:0,peak:0,lvl:0,t0:performance.now()};
  node.port.onmessage=e=>{const d=e.data;R.chunks.push(d);R.len+=d.length;let p=0;for(const x of d){const a=x<0?-x:x;if(a>p)p=a}R.peak=Math.max(R.peak,p);R.lvl=Math.max(p,R.lvl*.9)}}

// References: one tile per emotion, in rows of four: everyday, heat, hurt and hush.
function palette(v){const by=Object.fromEntries(v.refs.map(r=>[r.emotion,r])),n={};S.forEach(l=>{if(l.voice==v.id)n[l.emotion]=(n[l.emotion]||0)+1});
 return `<div class="pal">${EMO().map(em=>{const r=by[em],open=CF&&CF.at=='pal'&&(CF.slot==em||r&&!CF.slot&&CF.path==r.path),k=n[em]?`<span class="tcnt" title="${esc(v.id)} has ${n[em]} line${n[em]>1?'s':''} marked ${em}">${n[em]} line${n[em]>1?'s':''}</span>`:'';
  if(!r&&!v.refs.length)return `<div class="tile empty"><span class="tn">${em}${k}</span><span class="tr"><span class="ts">${em=='neutral'?'Use as… on a candidate below':'falls back to neutral'}</span></span></div>`;

  const sc=r.source&&r.source.kind=='candidate'&&r.source.version=='current'&&v.candidates.find(c=>c.n==r.source.n);
  return `<div class="tile ${open?'on':''}" title="${esc(r.text)}"><span class="tn">${play(r.path)}${em}${k}</span><span class="tr"><span class="ts">${refSrcShort(v,r.source)}</span>${sc&&warbly(sc)?warbleTag(sc):''}
   <span class="ta"><button class="mini" title="This voice in a new delivery, from this reference (✦ Restyle: new candidates)" onclick="openCF({at:'pal',mode:'restyle',voice:'${v.id}',path:'${r.path}'})">✦</button><button class="mini" title="This reference's delivery in another voice (⇄ Mirror: new candidates)" onclick="openCF({at:'pal',mode:'mirror',voice:'${v.id}',path:'${r.path}'})">⇄</button><button class="x" title="Remove this reference (asks first)" onclick="openCF({at:'pal',mode:'unref',voice:'${v.id}',emo:'${em}',path:'${r.path}'})">✕</button></span></span></div>`}).join('')}</div>`}

function behind(v){const g={},other=[];v.refs.forEach(r=>{const s=r.source;if(s&&s.kind=='candidate')(g[s.n]=g[s.n]||[]).push(r.emotion);else other.push(r.emotion)});
 const ks=Object.keys(g);if(ks.length+(other.length?1:0)<2)return'';
 return `<div class="behind" title="Each candidate is a voice of its own: lines cloned from different ones sound like different people. ⇄ Mirror moves a delivery into the one you want.">References from ${ks.length} candidate${ks.length>1?'s':''}: ${ks.map(n=>`<span class="rsrc" onclick="seeCand('${v.id}',${n})">#${n}</span> (${g[n].join(', ')})`).join(' · ')}${other.length?` · and other clips (${other.join(', ')})`:''}</div>`}
function refSrcShort(v,s){if(!s)return '<span title="Not found among its candidates or takes">source unknown</span>';

  return `<span class="${live?'rsrc':''}" title="${esc(t)}${live?'. Click to show it.':''}" ${live?`onclick="seeCand('${v.id}',${s.n})"`:''}>#${s.n}${s.version=='current'?'':s.version=='deleted'?', deleted':', older audio'}</span>`}
 return `<span title="${esc('Made from '+srcLabel(s))}">← ${esc(short(srcLabel(s),34))}</span>`}

function designCtl(v){return `<select class="dn" title="How many">${[2,3,6].map(n=>`<option ${n==3?'selected':''}>${n}</option>`).join('')}</select><button class="go" onclick="job({kind:'design',voice:'${v.id}',n:+this.previousElementSibling.value});note('Designing: new candidates appear at the top when it\\'s done')" title="New voices from the description (local Qwen3-TTS VoiceDesign)">Design new</button>`}

 return `<div class="cands2">${cs.map(c=>candRow(v,c)).join('')||'<div class="src" style="padding:8px 10px">None of this kind.</div>'}</div>

  <button class="usebtn ${CF&&CF.at==c.path&&CF.mode=='use'?'t':''}" onclick="event.stopPropagation();openCF({at:'${c.path}',mode:'use',voice:'${v.id}',path:'${c.path}',emo:'${c.restyle&&c.restyle.emotion||''}'})" title="Make it one of ${esc(v.id)}'s references, for an emotion (says what it replaces, and asks)">Use as${c.restyle&&c.restyle.emotion&&!c.uses.some(u=>u.emotion==c.restyle.emotion&&u.version=='current')?' '+c.restyle.emotion:''}…</button>
  <button class="mini more ${CF&&CF.at==c.path&&CF.mode!='use'?'t':''}" onclick="event.stopPropagation();openCF({at:'${c.path}',mode:'more',voice:'${v.id}',path:'${c.path}'})" title="More: ✦ restyle, ⇄ mirror, hear it cloned, read the audition text again, give to another voice, delete">⋯</button></div>
  ${CF&&CF.at==c.path?castForm(v,c):''}`}
// Seed-VC's conversions warble: every mirror, and the restyles made before they were read again cleanly.
const warbly=c=>!!(c.mirror||c.restyle&&c.restyle.engine!='editx'&&!c.restyle.reread);

function candDesc(v,c){
 if(c.reread){const r=c.reread;return `<span class="rrd" title="Candidate ${r.of}'s voice reading: “${esc(r.text)}”">↻ #${r.of} reads “${esc(short(r.text,52))}”</span>`}

 const b=[];if(c.origin)b.push(`<span class="from" title="Designed for ${esc(c.origin.voice)} (their candidate ${c.origin.candidate}) from: ${esc(c.origin.description)}">from ${esc(c.origin.voice)}</span>`);

 if(c.retries)b.push(`<span class="dsg" title="Read again with a new audition text ${c.retries} time${c.retries>1?'s':''} (↻): references made before keep the older audio">↻${c.retries>1?c.retries:''}</span>`);

function usesChip(v,c){const now=c.uses.filter(u=>u.version=='current'),old=c.uses.filter(u=>u.version!='current');

 CF=o;if(o.at!='pal')CSEL=o.at;draw();
 const f=document.querySelector('.cform textarea,.cform input:not([type=radio]),.cform select');if(f){f.scrollIntoView({block:'center'});if(o.mode=='restyle'||o.mode=='mirror')f.focus()}}

  return `<div class="cform acts2"><button onclick="openCF({at:'${c.path}',mode:'restyle',voice:'${v.id}',path:'${c.path}'})" title="New candidates: this voice read another way (shouting, whispering, crying, vengeful…)">✦ Restyle <span class="src">this voice, new delivery</span></button>
   <button onclick="openCF({at:'${c.path}',mode:'mirror',voice:'${v.id}',path:'${c.path}'})" title="New candidates in another reference's or candidate's voice, keeping this one's timing and intonation">⇄ Mirror <span class="src">this delivery, another voice</span></button>
   ${c.previews.qwen?`${play(c.previews.qwen,'cloned by Qwen3-TTS')}<button class="mini" onclick="job({kind:'preview',voice:'${v.id}',candidate:${c.n},backend:'qwen'})" title="Make the cloned preview again">redo</button>`:`<button onclick="job({kind:'preview',voice:'${v.id}',candidate:${c.n},backend:'qwen'})" title="Its audition text read by Qwen3-TTS cloning it, as a line's takes are made: how the voice comes through cloning before you choose it (local, a few seconds)">Hear it cloned</button>`}
   ${warbly(c)?`<button onclick="openCF({at:'${c.path}',mode:'reread',voice:'${v.id}',path:'${c.path}',clean:1})" title="Its own words read again by Qwen3-TTS cloning it: the delivery kept, Seed-VC's warble gone, as a new candidate">↻ Read it again cleanly</button>`:''}
   <button onclick="openCF({at:'${c.path}',mode:'reread',voice:'${v.id}',path:'${c.path}'})" title="This voice (its original audio, cloned) reading other words, as a new candidate. This one, and the references made from it, stay as they are.">↻ Read new words…</button>
   <button onclick="openCF({at:'${c.path}',mode:'give',voice:'${v.id}',path:'${c.path}'})">Give to another voice…</button>
   <button class="danger" onclick="openCF({at:'${c.path}',mode:'del',voice:'${v.id}',path:'${c.path}'})">Delete…</button></div>`}
 if(F.mode=='use')return `<div class="cform">${head(`Use ${what} as ${esc(v.id)}'s…`,'reference for an emotion: that emotion\'s lines clone it')}
  <div class="row">${EMO().map(e=>{const r=v.refs.find(x=>x.emotion==e),u=c.uses.find(x=>x.emotion==e&&x.version=='current');
    return u?`<button class="preset" disabled title="Already ${esc(v.id)}'s ${e} reference: this very audio">${e} ✓</button>`
     :`<button class="preset ${F.emo==e?'on':''} ${r?'':'nw'}" onclick="CF.emo='${e}';draw()" title="${r?'Replaces the current '+e+' ('+esc(srcLabel(r.source)||'source unknown')+')':esc(v.id)+' has no '+e+' reference yet'}">${e}</button>`}).join('')}</div>
  ${F.emo?(()=>{const r=v.refs.find(x=>x.emotion==F.emo);return `<div class="row confirm">${r?`It replaces ${esc(v.id)}'s <b>${F.emo}</b> reference ${play(r.path,'hear it')} (${esc(srcLabel(r.source)||'source unknown')}), which is kept in ref/ with a timestamp. Takes already made keep their sound.`:`${esc(v.id)} has no <b>${F.emo}</b> reference yet: its ${F.emo} lines will clone this one.`}
   <button class="go" onclick="useAs('${v.id}','${c.path}','${F.emo}')">Make ${what} ${F.emo}</button><button onclick="closeCF()">Cancel</button></div>`})():'<div class="src">Choose the emotion. Nothing changes until you confirm.</div>'}</div>`;
 if(F.mode=='reread')return rereadHtml(v,c);

 if(F.mode=='del')return `<div class="cform">${head(`Delete ${what}?`)}<div class="row confirm">It moves to voices/${esc(v.id)}/design/rejected (recoverable).${c.uses.length?` The ${c.uses.map(u=>u.emotion).join(', ')} reference${c.uses.length>1?'s':''} made from it keep their own copy.`:''}

 if(F.mode=='unref')return `<div class="cform">${head(`Remove ${esc(v.id)}'s ${F.emo} reference?`)}<div class="row confirm">${play(F.path,F.emo)} It moves to ref/removed (recoverable). ${afterRemove(v,F.emo)} Takes already made keep their sound.
  <button class="danger" onclick="delRef('${v.id}','${F.emo}')">Remove it</button><button onclick="closeCF()">Cancel</button></div></div>`;
 if(F.mode=='mirror')return `<div class="cform">${head(`⇄ Mirror ${what}`,'its delivery (timing, intonation, energy) in another voice: new candidates of that voice (local Seed-VC, about 30 s)')}
  <div class="row">${play(F.path,what)}<span class="src">into the voice of</span><select onchange="CF.into=this.value;draw()"><option value="">choose a reference or candidate…</option>${intoOptions(F.into,F.path)}</select></div>
  <div class="row"><span class="src">make</span><select onchange="CF.kinds=this.value;draw()"><option value="clone,pitch" ${F.kinds=='clone,pitch'?'selected':''}>both kinds</option><option value="pitch" ${F.kinds=='pitch'?'selected':''}>pitch: the delivery note for note</option><option value="clone" ${F.kinds=='clone'?'selected':''}>clone: the voice's own pitch</option></select>
